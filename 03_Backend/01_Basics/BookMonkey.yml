opencollection: 1.0.0
info:
  name: BookMonkey
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: Get all books
      type: http
      seq: 1
    http:
      method: GET
      url: http://localhost:4730/books
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Get book by ISBN
      type: http
      seq: 2
    http:
      method: GET
      url: ''
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Create a book
      type: http
      seq: 3
    http:
      method: POST
      url: ''
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Update that book
      type: http
      seq: 4
    http:
      method: PATCH
      url: http://localhost:4730/books/9783518278741
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "title": "Die Macht der Computer und die Ohnmacht der Vernunft",
            "subtitle": "Vom schärfsten Kritiker der künstlichen Intelligenz",
            "isbn": "9783518278741",
            "abstract": "Weizenbaum will uns vor der Hybris der Naturwissenschaften warnen. Er fordert dazu auf, Wissenschaft und Technik rational einzusetzen, statt sie zu mystifizieren - und er tut dies mit viel Temperament. Insbesondere geht der erfolgreiche Computerwissenschaftler mit denjenigen seiner Kollegen ins Gericht, die uns (und wahrscheinlich sich selber) weismachen wollen, der Mensch sei im Prinzip nichts anderes als ein informationsverarbeitendes System, könne also vollständig mit einem hinreichend leistungsfähigen Computer simuliert werden. In eben dieser Überzeugung der Forscher, die sich mit der künstlichen Intelligenz beschäftigen und die er spöttisch dem Clan der »Artificial Intelligentsia« zuordnet, sieht Joseph Weizenbaum geradezu die Quintessenz naturwissenschaftlicher Borniertheit.",
            "numPages": 369,
            "author": "Joseph Weizenbaum",
            "publisher": "Suhrkamp Verlag",
            "price": "7,50€",
            "cover": "https://res.cloudinary.com/suhrkamp/images/c_limit,q_auto,f_auto,w_400/v1742218112/68155/die-macht-der-computer-und-die-ohnmacht-der-vernunft_9783518278741_cover.webp"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Get that book
      type: http
      seq: 5
    http:
      method: GET
      url: http://localhost:4730/books/1001606140805
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Delete that book
      type: http
      seq: 6
    http:
      method: DELETE
      url: http://localhost:4730/books/9783518278741
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-07-28T09:07:05.311Z'
    exportedUsing: Bruno
